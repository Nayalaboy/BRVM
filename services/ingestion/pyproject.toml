[project]
name = "brvm-ingestion"
version = "0.1.0"
description = "BRVM document ingestion worker: BOC bulletins, annual reports, earnings releases. RAG indexing lands in step 2."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
brvm-ingest = "brvm_ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brvm_ingestion"]

[tool.ruff]
line-length = 100
