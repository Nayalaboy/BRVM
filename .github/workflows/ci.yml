name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brvm
          POSTGRES_PASSWORD: brvm
          POSTGRES_DB: brvm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brvm -d brvm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brvm:brvm@localhost:5432/brvm
      AUTH_SECRET: ci-secret
      AUTH_DEV_LOGIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install -e "services/ingestion[dev]"
      - name: Lint
        run: ruff check services/ingestion
