name: pipeline-daily

on:
  schedule:
    # BRVM normally publishes the official close shortly after 15:15 GMT.
    # Refresh twice for source/GitHub scheduling delays, then run the full
    # BOC/recap pipeline later when the bulletin is more likely to exist.
    - cron: "30 15 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      BRVM_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRVM_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRVM_ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      # Object storage for BOC PDFs (optional; falls back to local otherwise)
      BRVM_STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
      BRVM_S3_BUCKET: ${{ vars.S3_BUCKET }}
      BRVM_S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      BRVM_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      BRVM_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: pip install -e "pipeline[dev]"
      - name: Migrate
        run: cd pipeline && alembic upgrade head
      - name: Fast market refresh
        if: github.event_name == 'schedule' && github.event.schedule != '30 18 * * 1-5'
        run: python -m brvm_pipeline.run market-refresh
      - name: Full daily run
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 18 * * 1-5'
        run: python -m brvm_pipeline.run daily
